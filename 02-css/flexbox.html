<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flexbox Düzeni</title>
  <link rel="stylesheet" href="flexbox.css">
</head>
<body>

  <header>
    <h1>Flexbox Düzeni Örneği</h1>
  </header>

  <main>
    <section class="flex-konteyner">
      <div class="flex-kart">
        <h3>Kart 1</h3>
        <p>Flexbox ile yan yana sıralanan birinci kart.</p>
      </div>

      <div class="flex-kart">
        <h3>Kart 2</h3>
        <p>Flexbox ile yan yana sıralanan ikinci kart.</p>
      </div>

      <div class="flex-kart">
        <h3>Kart 3</h3>
        <p>Flexbox ile yan yana sıralanan üçüncü kart.</p>
      </div>
    </section>
  </main>

</body>
</html>
