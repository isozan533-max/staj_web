<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Kapsamlı Proje</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .kart {
        background-color: #1e293b;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        text-align: center;
        width: 350px;
      }
      input {
        width: 80%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #475569;
        background-color: #0f172a;
        color: white;
        border-radius: 6px;
      }
      button {
        padding: 10px 20px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background-color: #2563eb;
      }
      #selamlamaMesaji {
        margin-top: 20px;
        font-size: 1.2rem;
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div class="kart">
      <h2>Stajyer Paneli</h2>
      <input type="text" id="kullaniciInput" placeholder="Adınızı girin..." />
      <br />
      <button id="girisBtn">Giriş Yap</button>
      <p id="selamlamaMesaji"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
