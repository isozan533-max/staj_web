<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Dinamik To-Do Listesi</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f8fafc;
      }
      .kapsayici {
        max-width: 400px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      input {
        width: 70%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      button {
        padding: 10px 15px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background-color: #2563eb;
      }
      ul {
        padding-left: 20px;
        margin-top: 20px;
      }
      li {
        margin-bottom: 8px;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="kapsayici">
      <h2>Yapılacaklar Listesi</h2>
      <input type="text" id="gorevInput" placeholder="Yeni görev yaz..." />
      <button id="ekleBtn">Ekle</button>

      <ul id="gorevListesi">
        <!-- JavaScript buraya dinamik görevler ekleyecek -->
      </ul>
    </div>

    <script src="todo.js"></script>
  </body>
</html>
