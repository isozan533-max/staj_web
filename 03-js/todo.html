<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Mini Proje - To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
    .kapsayici { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input { width: 70%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 8px 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2980b9; }
    ul { padding-left: 20px; margin-top: 20px; }
    li { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .sil-btn { background-color: #e74c3c; padding: 3px 8px; font-size: 12px; }
    .sil-btn:hover { background-color: #c0392b; }
  </style>
</head>
<body>

  <div class="kapsayici">
    <h2>Yapılacaklar Listesi</h2>
    <div>
      <input type="text" id="gorevInput" placeholder="Yeni görev yaz...">
      <button id="ekleBtn">Ekle</button>
    </div>
    
    <ul id="gorevListesi"></ul>
  </div>

  <script src="todo.js"></script>
</body>
</html>
