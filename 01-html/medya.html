<!doctype html>
<html lang="tr">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multimedya Etiketleri</title>
  <body>
    <header>
      <h1>Multimedya Galerisi</h1>
    </header>

    <main>
      <section>
        <h2>1. Resim Ekleme</h2>
        <img
          src="https://picsum.photos/400/250"
          alt="Örnek Manzara Resmi"
          width="400"
          height="250"
        />
      </section>

      <section>
        <h2>2. Ses Ekleme</h2>
        <audio controls>
          <source src="ornek-ses.mp3" type="audio/mpeg" />
          Tarayıcınız ses etiketini desteklemiyor.
        </audio>
      </section>

      <section>
        <h2>3. Video Ekleme</h2>
        <video controls width="400">
          <source src="ornek-video.mp4" type="video/mp4" />
          Tarayıcınız video etiketini desteklemiyor.
        </video>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Multimedya Sayfası</p>
    </footer>
  </body>
</html>
