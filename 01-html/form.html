<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>İletişim Sayfası</title>
  </head>
  <body>
    <h1>İletişim Sayfası</h1>
    <h2>Bize Ulaşın</h2>

    <form action="../tesekkur.html" method="GET">
      <label for="adsoyad">Ad Soyad:</label><br />
      <input type="text" id="adsoyad" name="adsoyad" required /><br /><br />

      <label for="eposta">E-posta Adresi:</label><br />
      <input type="email" id="eposta" name="eposta" required /><br /><br />

      <label for="konu">Konu:</label><br />
      <select id="konu" name="konu">
        <option value="teknik">Teknik Destek</option>
        <option value="bilgi">Genel Bilgi</option>
        <option value="diger">Diğer</option></select
      ><br /><br />

      <label for="mesaj">Mesajınız:</label><br />
      <textarea id="mesaj" name="mesaj" rows="4" cols="30" required></textarea
      ><br /><br />

      <button type="submit">Gönder</button>
    </form>

    <br />
    <p>&copy; 2026 İletişim Sayfası</p>
  </body>
</html>
